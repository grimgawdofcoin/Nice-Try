name: Build NiceClip for Windows

on:
  push:
    branches: ["**"]
    paths: ["niceclip/**", ".github/workflows/build-windows.yml"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: niceclip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: niceclip/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download full ffmpeg build (libass captions)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile 'ffmpeg.zip'
          Expand-Archive -Force 'ffmpeg.zip' 'ffmpeg_tmp'
          $exe = Get-ChildItem 'ffmpeg_tmp' -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force 'tools/ffmpeg' | Out-Null
          Copy-Item $exe.FullName 'tools/ffmpeg/ffmpeg.exe'

      # So the shipped app never needs to reach huggingface.co at runtime —
      # a network-blocked user hit exactly that failure in production.
      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: niceclip/tools/whisper_models
          key: whisper-models-${{ hashFiles('niceclip/requirements.txt', 'niceclip/scripts/download_whisper_models.py') }}

      - name: Download Whisper speech models (offline use)
        run: python scripts\download_whisper_models.py

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onedir --name NiceClip
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all tokenizers
          --collect-all imageio_ffmpeg
          --add-data "niceclip\web;niceclip\web"
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          run.py

      - name: Bundle ffmpeg and Whisper models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'dist/NiceClip/ffmpeg' | Out-Null
          Copy-Item 'tools/ffmpeg/ffmpeg.exe' 'dist/NiceClip/ffmpeg/ffmpeg.exe'
          Copy-Item -Recurse 'tools/whisper_models' 'dist/NiceClip/whisper_models'

      - name: Smoke test the frozen app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist/NiceClip/NiceClip.exe' `
            -ArgumentList '--no-browser','--port','8791' -PassThru `
            -RedirectStandardOutput app-out.log -RedirectStandardError app-err.log
          $health = $null
          foreach ($i in 1..24) {
            Start-Sleep -Seconds 5
            if ($p.HasExited) { Write-Host "App exited early (code $($p.ExitCode))"; break }
            try { $health = Invoke-RestMethod 'http://127.0.0.1:8791/api/health'; break } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host '--- app stdout ---'; Get-Content app-out.log -ErrorAction SilentlyContinue
          Write-Host '--- app stderr ---'; Get-Content app-err.log -ErrorAction SilentlyContinue
          if (-not $health) { throw 'frozen app never became healthy' }
          $health | ConvertTo-Json
          if (-not $health.ffmpeg) { throw 'ffmpeg not detected in frozen app' }
          if (-not $health.whisper) { throw 'faster-whisper not importable in frozen app' }
          # The frozen exe must actually FIND its bundled models, not just
          # ship them — otherwise it silently falls back to downloading at
          # runtime, which is the exact failure this bundling prevents.
          $expected = @('base','medium','small','tiny')
          $found = @($health.offline_models) | Sort-Object
          # -not $found matters: a 0-object pipeline capture collapses to
          # $null in PowerShell, and $null -eq 0 is False, so a .Count-only
          # test would never fire on the empty case.
          if (-not $found -or $found.Count -eq 0) {
            throw 'frozen app found NO bundled Whisper models — it would try to download at runtime'
          }
          $missing = $expected | Where-Object { $_ -notin $found }
          if ($missing) { throw "frozen app cannot find bundled model(s): $($missing -join ', ')" }
          Write-Host "Frozen app resolves all bundled models offline: $($found -join ', ')"

      - name: Zip package
        shell: pwsh
        run: Compress-Archive -Path 'dist/NiceClip' -DestinationPath 'NiceClip-windows.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: NiceClip-windows
          path: niceclip/NiceClip-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: niceclip/NiceClip-windows.zip
